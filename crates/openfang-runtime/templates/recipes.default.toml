# file_convert recipe manifest
#
# Canonical location at runtime: <openfang_home>/convert/recipes.toml
#   (openfang_home = $OPENFANG_HOME, else ~/.openfang)
#
# This file IS the compiled-in default table (embedded via include_str!). If no
# manifest exists at the runtime location, these recipes are used, so a fresh
# install can convert md -> pdf with no config. To extend or override, copy this
# file to <openfang_home>/convert/recipes.toml and add [[recipe]] rows.
#
# A present-but-malformed manifest is a hard error (fail-closed) -- it is never
# silently replaced by this default.
#
# Token substitution (performed at dispatch time, NOT by a shell):
#   {script}  -> <openfang_home>/scripts
#   {input}   -> sandbox-resolved absolute path of the input file
#   {output}  -> sandbox-resolved absolute path of the output file
#   {<option>} -> a caller-supplied, validated option value (see [recipe.options])
# argv[0] is the program; the remaining entries are literal arguments. There is
# no shell parsing, globbing, or word-splitting -- each array element is one argv.
#
# OPTIONS (ANAI-131): [recipe.options.<name>] declares a caller-suppliable,
# typed render knob. Each option maps to a value-taking script flag; because the
# argv array is fixed-length (no conditional inclusion), every option carries a
# `default` and an empty-string default means "no override". Enum options list
# their allowed `values`; string options are free-form. Option values are
# type/enum-validated before substitution and always land as single argv
# literals (never re-parsed by a shell). These declarations are projected into
# the file_convert tool schema so callers discover them automatically.
#
# TIMEOUTS (ANAI-286): `timeout_secs` on a [[recipe]] bounds that recipe's
# subprocess. Omit it to inherit the operator's `[convert] default_timeout_secs`
# (120s). A value above `[convert] max_timeout_secs` (600s) is clamped down and
# the clamp is disclosed -- requested AND enforced -- never silently honored.
# Blowing the deadline kills the child and returns the CONVERT_TIMEOUT code,
# which is deliberately distinct from CONVERT_FAILED: "still running" and
# "exited nonzero" want different retries. The value belongs to the recipe
# because it is a property of the conversion; the policy belongs to the operator
# because it is a property of the host. Neither is per-agent.
#
# DEPENDENCIES (ANAI-287). Two complementary pre-spawn checks:
#   needs       -- PATH search for an EXECUTABLE. Cannot see a missing library:
#                  a recipe backed by a Python extractor passes
#                  needs = ["python3"] perfectly while the module it imports is
#                  gone. An entry containing a `/` is checked as a literal path
#                  instead of being searched, which is how you pin a venv
#                  interpreter rather than whatever `python3` resolves to today.
#   needs_files -- plain existence check on an ABSOLUTE path. No PATH search, no
#                  executable bit. Point it at the import target itself (e.g.
#                  .../site-packages/<pkg>/__init__.py) to catch the case `needs`
#                  structurally cannot: user-site packages orphaned by an
#                  interpreter upgrade.
# Neither can prove a module is *importable* -- only the interpreter that runs
# the conversion can answer that. So a script-backed launcher should import its
# dependencies at the top and EXIT 3 on ImportError: exit code 3 is reserved,
# and the dispatcher maps it to MISSING_DEP rather than CONVERT_FAILED.

[[recipe]]
from    = "md"
to      = "pdf"
argv    = [
  "{script}/build-pdf.sh", "{input}", "-o", "{output}",
  "--orientation", "{orientation}",
  "--font-body", "{font_body}",
  "--font-header", "{font_header}",
  "--font-mono", "{font_mono}",
  "--font-size", "{font_size}",
  "--margin", "{margin}",
  "--paper", "{paper}",
  "--highlight-style", "{highlight_style}",
  "--embed-resources", "{embed_images}",
  "--table-align", "{table_align}",
  "--table-justify", "{table_justify}",
  "--table-grid", "{table_grid}",
]
needs   = ["pandoc", "typst"]
out_ext = "pdf"

[recipe.options.orientation]
type    = "enum"
values  = ["portrait", "landscape"]
default = "portrait"   # ANAI-131 O1: tool default is portrait (script's own default is landscape; the recipe passes portrait explicitly)
desc    = "Page orientation"

[recipe.options.font_body]
type    = "string"
default = ""           # empty = template default
desc    = "Body text font family (e.g. \"Libertinus Serif\")"

[recipe.options.font_header]
type    = "string"
default = ""
desc    = "Heading font family; empty inherits the body font"

[recipe.options.font_mono]
type    = "string"
default = ""
desc    = "Monospace / code-block font family"

[recipe.options.font_size]
type    = "string"
default = ""
desc    = "Base text size, e.g. \"11pt\"; empty = template default"

[recipe.options.margin]
type    = "string"
default = "1in"
desc    = "Page margin, e.g. \"1in\", \"0.9in\", \"2cm\""

[recipe.options.paper]
type    = "string"
default = "us-letter"
desc    = "Paper size, e.g. \"us-letter\", \"a4\""

[recipe.options.highlight_style]
type    = "string"
default = ""
desc    = "Code syntax-highlight theme (pandoc --highlight-style), e.g. \"tango\", \"kate\", \"monochrome\""

[recipe.options.embed_images]
type    = "enum"
values  = ["true", "false"]
default = "true"       # ANAI-131 O2: self-contained by default (images bundled into the PDF)
desc    = "Bundle referenced images into the PDF for a self-contained, portable file"

[recipe.options.table_align]
type    = "enum"
values  = ["", "left", "center", "right"]
default = ""           # empty = leave pandoc/typst default alignment
desc    = "Table cell horizontal alignment"

[recipe.options.table_justify]
type    = "enum"
values  = ["true", "false"]
default = "false"      # ANAI-131 O3: cell-content justification (best-effort), not column width
desc    = "Justify text within table cells (best-effort)"

[recipe.options.table_grid]
type    = "enum"
values  = ["true", "false"]
default = "true"       # 2026-09-21: ON by default so generated PDFs stay machine-readable.
desc    = "Draw a full stroke grid on tables. ON by default: pandoc's typst template strokes only a single rule under the header, which leaves the PDF with zero vertical rules and makes table structure unrecoverable by pdf->md extraction. Set false for the older borderless look."

# ------------------------------------------------------------------------------
# html -> png (ANAI-288)
#
# This arm shipped in the deployed manifest but was never added to the embedded
# default, so a FRESH install had no html->png recipe at all -- the capability
# existed only on hosts whose operator had hand-copied a manifest. Restoring it
# here makes the compiled-in table match the capability we actually document.
#
# PRESETS instead of options: viewport and scale always travel together, and a
# caller asking for "mobile" is choosing a device, not two independent numbers.
#
# HOST PIN, and its one wart: `needs` is a literal absolute path because Chrome
# on macOS installs as a .app and is never on PATH. The launcher honours
# $OPENFANG_CHROME for other hosts, but `needs` cannot read the environment --
# so on a host with Chrome elsewhere the preflight fails MISSING_DEP with the
# macOS path named, and the operator's fix is to override this recipe in
# <openfang_home>/convert/recipes.toml. That is a loud, accurate refusal rather
# than a silent misfire, which is why it is acceptable as a default.
[[recipe]]
from    = "html"
to      = "png"
argv    = [
  "{script}/html2png.sh", "{input}", "-o", "{output}",
  "--viewport", "{viewport}",
  "--scale", "{scale}",
]
needs   = ["/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"]
out_ext = "png"
default_preset = "mobile"

[recipe.presets.mobile]
viewport = "390,844"
scale    = "3"

[recipe.presets."mobile-sm"]
viewport = "360,800"
scale    = "3"

[recipe.presets.tablet]
viewport = "820,1180"
scale    = "2"

[recipe.presets.desktop]
viewport = "1280,800"
scale    = "2"

[recipe.presets.wide]
viewport = "1920,1080"
scale    = "2"

[recipe.presets.square]
viewport = "1080,1080"
scale    = "2"

[recipe.presets.og]
viewport = "1200,630"
scale    = "2"

# ------------------------------------------------------------------------------
# pdf -> txt (ANAI-290)
#
# The text-layer arm. `pdftotext -layout` preserves columns and table-ish
# alignment well enough to read, which covers the common "point me at a PDF and
# let me read it" case with no new engine and no Rust.
#
# It is NOT the pdf->md arm. Markdown is a separate recipe backed by pdfplumber,
# because only table EXTRACTION produces real pipe tables -- and calling
# space-aligned ASCII "markdown" because the file ends in .md is the same
# quiet lie we have spent the month removing.
#
# WHY A LAUNCHER RATHER THAN A BARE pdftotext argv: pdftotext exits 0 on a PDF
# with no text layer and writes an EMPTY file. That is a successful-looking
# conversion of nothing. pdf2txt.sh counts the extracted characters and fails
# with a diagnosis instead, and exits 3 on a missing binary so the dispatcher
# reports MISSING_DEP rather than CONVERT_FAILED.
[[recipe]]
from    = "pdf"
to      = "txt"
argv    = [
  "{script}/pdf2txt.sh", "{input}", "-o", "{output}",
  "--layout", "{layout}",
  "--first-page", "{first_page}",
  "--last-page", "{last_page}",
  "--min-chars", "{min_chars}",
]
needs   = ["pdftotext"]
out_ext = "txt"
# Extraction is cheap next to a render, but a few hundred pages of pdfminer-
# class work is not instant. Generous, still bounded.
timeout_secs = 180

[recipe.options.layout]
type    = "enum"
values  = ["true", "false"]
default = "true"
desc    = "Preserve the original physical layout (pdftotext -layout). ON by default: it keeps columns and table alignment readable. Set false for a single reflowed text stream."

[recipe.options.first_page]
type    = "string"
default = ""           # empty = from page 1
desc    = "First page to extract, 1-based. Empty extracts from the beginning."

[recipe.options.last_page]
type    = "string"
default = ""           # empty = to the last page
desc    = "Last page to extract, 1-based. Empty extracts to the end. Pair with first_page to bound a large document."

[recipe.options.min_chars]
type    = "string"
default = "1"
desc    = "Refuse the conversion if fewer than this many characters were extracted. The default of 1 catches the image-only/scanned PDF, which pdftotext reports as a successful extraction of nothing. Raise it to assert a document has real body text."

# ---------------------------------------------------------------------------
# pdf -> md (tier 1: the document's OWN logical structure tree)
#
# This arm reads the structure a tagged PDF STATES -- StructTreeRoot -> Table ->
# TR -> TH/TD, with mcids naming the text each node owns -- instead of inferring
# it from ruling lines and word positions. Measured, the geometric approach
# drops the first row of every table into the surrounding prose (no rule above
# the header means no band) and fabricates tables on pages of running prose.
# Both failures exit 0 and look correct.
#
# UNTAGGED input is REFUSED (exit 4), not best-efforted. Word/Office exports and
# pandoc+typst output (including OpenFang's own PDFs, with or without
# --table-grid) are tagged; design-tool PDFs and headless-Chrome HTML->PDF are
# not. For those, use the pdf->txt arm and accept a best-effort text layer.
#
# DEPENDENCY NOTE: pdfplumber is a Python LIBRARY, so `needs` -- which resolves
# names on PATH -- cannot see it. pdf2md.py re-execs once into the pinned venv
# at <openfang_home>/venv/pdf and exits 3 (MISSING_DEP) if the module is still
# unavailable, which is the only check that can be truthful about an import.
# An operator wanting a pre-spawn signpost can add an absolute
#   needs_files = [".../venv/pdf/lib/python3.X/site-packages/pdfplumber/__init__.py"]
# here; it is left out of this default because that path is host-specific.
[[recipe]]
from    = "pdf"
to      = "md"
argv    = [
  "{script}/pdf2md.py", "{input}", "-o", "{output}",
  "--min-chars", "{min_chars}",
  "--require-tables", "{require_tables}",
  "--provenance", "{provenance}",
]
needs   = ["python3"]
out_ext = "md"
# pdfminer-class parsing runs roughly 0.3-1s per page, and this walks the word
# index as well. Generous for a few hundred pages, still bounded.
timeout_secs = 300

[recipe.options.min_chars]
type    = "string"
default = "1"
desc    = "Refuse the conversion if the rendered markdown is shorter than this many characters. Catches a PDF that is tagged but whose tree yields almost nothing."

[recipe.options.require_tables]
type    = "enum"
values  = ["true", "false"]
default = "false"
desc    = "Refuse unless the structure tree states at least one Table. Use when you are converting specifically to recover tables and an answer without them is worthless."

[recipe.options.provenance]
type    = "enum"
values  = ["true", "false"]
default = "true"
desc    = "Emit an HTML comment header naming the extractor, tier, source, page count and table count. ON by default so a suspect cell is traceable to the method that produced it."
